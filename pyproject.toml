[project]
name = "No_More_VFS"
version = "0.1.0"
description = "自研变声 DSP 链：独立控制移调与共振峰（离线 v1）"
requires-python = ">=3.13"

# 门禁：ruff（缺陷类规则）+ pytest。第一天就必须全绿。
[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["env", "output"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]

[tool.ruff.lint.isort]
known-first-party = ["voice_shift", "analyze_f0", "render_scan", "realtime", "gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["scripts"]
